# Walks through the app on an iOS simulator and takes a screenshot of each screen, so the
# look can be checked without a phone. Run by .github/workflows/screenshots.yml.
# MAESTRO_TEST_EMAIL and MAESTRO_TEST_PASSWORD are GitHub repository secrets.
appId: com.simplytk.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Sign in to simplytk'
    timeout: 30000
- takeScreenshot: 01-sign-in
- tapOn: 'Use email or phone'
- takeScreenshot: 02-sign-in-email
- tapOn:
    text: 'Email'
    index: 1
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn: 'Password'
- inputText: ${MAESTRO_TEST_PASSWORD}
- tapOn: 'Sign in to simplytk'
- tapOn: 'Sign in'
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 03-home
- scroll
- takeScreenshot: 04-home-scrolled
- tapOn:
    point: 30%, 95%
- waitForAnimationToEnd
- takeScreenshot: 05-tracker
- scroll
- takeScreenshot: 06-tracker-scrolled
- tapOn:
    point: 50%, 95%
- waitForAnimationToEnd
- takeScreenshot: 07-daily
- tapOn:
    point: 70%, 95%
- waitForAnimationToEnd
- takeScreenshot: 08-ranks
- tapOn:
    point: 90%, 95%
- waitForAnimationToEnd
- takeScreenshot: 09-more
- scroll
- takeScreenshot: 10-more-scrolled
# Tracker: open the first opening.
- tapOn:
    point: 30%, 95%
- scrollUntilVisible:
    element:
      text: 'Search by firm'
    direction: UP
    optional: true
- tapOn:
    point: 50%, 80%
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 11-opening
- scroll
- takeScreenshot: 12-opening-scrolled
- swipe:
    start: 1%, 50%
    end: 90%, 50%
- waitForAnimationToEnd
# Home: search and profile buttons.
- tapOn:
    point: 10%, 95%
- tapOn:
    point: 82%, 9%
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 13-home-search
- swipe:
    start: 1%, 50%
    end: 90%, 50%
- tapOn:
    point: 92%, 9%
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 14-home-profile
- swipe:
    start: 1%, 50%
    end: 90%, 50%
- runFlow:
    file: visit.yaml
    env:
      LABEL: 'My applications'
      NAME: 20-applications
- runFlow:
    file: visit.yaml
    env:
      LABEL: 'Opening soon'
      NAME: 21-opening-soon
- runFlow:
    file: visit.yaml
    env:
      LABEL: 'Live feed'
      NAME: 22-live-feed
- runFlow:
    file: visit.yaml
    env:
      LABEL: 'Startup opportunities'
      NAME: 23-opportunities
- runFlow:
    file: visit.yaml
    env:
      LABEL: 'Pre-uni tracker'
      NAME: 24-preuni
- runFlow:
    file: visit.yaml
    env:
      LABEL: 'Submit an opening'
      NAME: 25-submit
- runFlow:
    file: visit.yaml
    env:
      LABEL: 'CV rater'
      NAME: 30-cv-rater
- runFlow:
    file: visit.yaml
    env:
      LABEL: 'Cover letter'
      NAME: 31-cover-letter
- runFlow:
    file: visit.yaml
    env:
      LABEL: 'Firm prep'
      NAME: 32-firm-prep
- runFlow:
