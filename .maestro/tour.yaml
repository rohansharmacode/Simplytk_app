# Walks through the app on an iOS simulator and takes a screenshot of each screen, so the
# look can be checked without a phone. Run by .github/workflows/screenshots.yml.
# MAESTRO_TEST_EMAIL and MAESTRO_TEST_PASSWORD are GitHub repository secrets.
appId: com.simplytk.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Sign in to simplytk'
    timeout: 30000
- takeScreenshot: 01-sign-in
- tapOn: 'Use email or phone'
- takeScreenshot: 02-sign-in-email
- tapOn:
    text: 'Email'
    index: 1
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn: 'Password'
- inputText: ${MAESTRO_TEST_PASSWORD}
- tapOn: 'Sign in to simplytk'
- tapOn: 'Sign in'
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 03-home
- scroll
- takeScreenshot: 04-home-scrolled
- tapOn:
    point: 30%, 95%
- waitForAnimationToEnd
- takeScreenshot: 05-tracker
- scroll
- takeScreenshot: 06-tracker-scrolled
- tapOn:
    point: 50%, 95%
- waitForAnimationToEnd
- takeScreenshot: 07-daily
- tapOn:
    point: 70%, 95%
- waitForAnimationToEnd
- takeScreenshot: 08-ranks
- tapOn:
    point: 90%, 95%
- waitForAnimationToEnd
- takeScreenshot: 09-more
- scroll
- takeScreenshot: 10-more-scrolled
# Tracker: open the first opening.
- tapOn:
    point: 30%, 95%
- scrollUntilVisible:
    element:
      text: 'Search by firm'
    direction: UP
    optional: true
- tapOn:
    point: 50%, 80%
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 11-opening
- scroll
- takeScreenshot: 12-opening-scrolled
- tapOn:
    point: 5%, 9%
- waitForAnimationToEnd
# Home: search and profile buttons.
- tapOn:
    point: 10%, 95%
- tapOn:
    point: 81%, 9%
- waitForAnimationToEnd
- takeScreenshot: 13-home-search
- tapOn:
    point: 10%, 95%
- tapOn:
    point: 92%, 9%
- waitForAnimationToEnd
- takeScreenshot: 14-home-profile
- runFlow:
    file: visit.yaml
    env:
      LINK: 'applications'
      NAME: 20-applications
- runFlow:
    file: visit.yaml
    env:
      LINK: 'opening-soon'
      NAME: 21-opening-soon
- runFlow:
    file: visit.yaml
    env:
      LINK: 'live'
      NAME: 22-live-feed
- runFlow:
    file: visit.yaml
    env:
      LINK: 'opportunities'
      NAME: 23-opportunities
- runFlow:
    file: visit.yaml
    env:
      LINK: 'submit-opening'
      NAME: 25-submit
- runFlow:
    file: visit.yaml
    env:
      LINK: 'cv-rater'
      NAME: 30-cv-rater
- runFlow:
    file: visit.yaml
    env:
      LINK: 'cover-letter'
      NAME: 31-cover-letter
- runFlow:
    file: visit.yaml
    env:
      LINK: 'interview-prep'
      NAME: 32-firm-prep
- runFlow:
    file: visit.yaml
    env:
      LINK: 'mock-interview'
      NAME: 33-mock-interview
- runFlow:
    file: visit.yaml
    env:
      LINK: 'ps-builder'
      NAME: 34-ps-builder
- runFlow:
    file: visit.yaml
    env:
      LINK: 'study-coach'
      NAME: 35-study-coach
- runFlow:
    file: visit.yaml
    env:
      LINK: 'drills'
      NAME: 40-drills
- runFlow:
    file: visit.yaml
    env:
      LINK: 'progress'
      NAME: 41-progress
- runFlow:
    file: visit.yaml
    env:
      LINK: 'duels'
      NAME: 42-duels
- runFlow:
    file: visit.yaml
    env:
      LINK: 'oa-prep'
      NAME: 43-oa-prep
- runFlow:
    file: visit.yaml
    env:
      LINK: 'course'
      NAME: 44-course
- runFlow:
    file: visit.yaml
    env:
      LINK: 'spring-week-playbook'
      NAME: 50-playbook
- runFlow:
    file: visit.yaml
    env:
      LINK: 'resources'
      NAME: 51-resources
- runFlow:
    file: visit.yaml
    env:
      LINK: 'dashboard/settings'
      NAME: 52-settings
- runFlow:
    file: visit.yaml
    env:
      LINK: 'play/mental-maths'
      NAME: 45-play-mental-maths
- runFlow:
    file: visit.yaml
