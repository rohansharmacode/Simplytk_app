# Opens one screen by its simplytk:// link, screenshots it and its scrolled view, and goes back.
# Env: LINK (app path without the leading slash) and NAME (screenshot name).
appId: com.simplytk.app
---
- openLink: simplytk://${LINK}
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${NAME}
- scroll
- takeScreenshot: ${NAME}-scrolled
- tapOn:
    point: 5%, 9%
- waitForAnimationToEnd
