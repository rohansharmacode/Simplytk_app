# Builds the app for the iOS simulator and runs .maestro/tour.yaml, which screenshots
# every main screen. Start it with: npx eas-cli workflow:run .eas/workflows/screenshots.yml
name: screenshots

jobs:
  build_simulator:
    type: build
    params:
      platform: ios
      profile: simulator

  tour:
    needs: [build_simulator]
    type: maestro
    environment: preview
    params:
      build_id: ${{ needs.build_simulator.outputs.build_id }}
      flow_path: ['.maestro/tour.yaml']
      device_identifier: 'iPhone 16 Pro'
